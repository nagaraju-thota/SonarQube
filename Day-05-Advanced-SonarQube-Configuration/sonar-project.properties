# ===== Project Identity =====
sonar.projectKey=day-06-advanced-concepts
sonar.projectName=day-06 advanced concepts
sonar.projectVersion=1.0

# ===== Source & Test Paths =====
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# ===== Exclusions (Topic 1) =====
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,**/*.min.js
sonar.test.exclusions=node_modules/**,dist/**,build/**

# ===== Coverage exclusions (wiring/config files) =====
sonar.coverage.exclusions=**/*.config.js,src/app.js,src/config/**,**/*.test.js

# ===== Coverage report =====
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ===== Language =====
sonar.language=js
sonar.sourceEncoding=UTF-8