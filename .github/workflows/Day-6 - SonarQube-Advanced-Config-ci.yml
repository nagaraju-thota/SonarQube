name: Day 6 - SonarQube Advanced Config

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
    paths:
      - 'Day-05-Advanced-SonarQube-Configuration/**'
  workflow_dispatch:
    
jobs:
  sonarqube:
    name: SonarQube Scan (Day 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day-05-Advanced-SonarQube-Configuration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Day-05-Advanced-SonarQube-Configuration

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: Day-05-Advanced-SonarQube-Configuration/.scannerwork/report-task.txt